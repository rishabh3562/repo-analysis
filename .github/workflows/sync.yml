name: GitHub Sync (6h)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      MONGO_AI_URI: ${{ secrets.MONGO_AI_URI }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      REPO_PATH: /home/runner/work/repo-analysis/repo-analysis
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pymongo requests
      
      - name: Run sync
        run: python scripts/sync.py
      
      - name: Log result
        if: always()
        run: echo "Sync completed with status ${{ job.status }}"